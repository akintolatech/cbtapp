{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="image/x-icon" href="{% static 'img/afms logo.ico' %}" rel="icon" />
    <link type="text/css" href="{% static 'style/styles.css' %}" rel="stylesheet"/>
    <link type="text/css" href="{% static 'style/dashboard.css' %}" rel="stylesheet"/>
    <link type="text/css" href="{% static 'style/auth.css' %}" rel="stylesheet" />
<!--    <script src="{% static 'js/timer.js' %}"></script>-->
    <script>
        
        window.onload = function(){
            window.localStorage.clear()
        };

        //Prevent Data
        history.pushState(null, null, );
        window.addEventListener('popstate', function(event) {
        history.pushState(null, null, );
        });

    </script>

</head>
<body>

    <div id="main">

            <div class="result-container">
                <div class="result-item">
                    <center style="margin-top: 60px;">

                        {%  for itm in results %}
                        <img src="{% static 'img/ribbon.png' %}" alt="" width="200px"/>
                        <h1>Congratulations {{ request.user }} </h1>
                        <p>
                            You have successfully written the <br/><b style="color:#38c16f;">{{ itm.test }} </b>  <br/>
                            you scored <br/>
                            <h1 class="score" style="color: green;"> {{ itm.score }}</h1>
                        </p>
                        {% empty %}
                        <h1>You have no result for this test</h1>
                        <p>Contact Admin</p>
                        {% endfor %}

                    </center>

                    <center>
                        <div class="btn-container" style="max-width: 600px;">
                            <a href="{% url 'authenticator:student_dashboard' %}"><button>Go to Dashboard</button></a>
                            <a href="{% url 'authenticator:login' %}"><button class="logout-btn">Log Out</button></a>
                        </div>
                    </center>
                </div>
        

            </div>

    </div>

    <script>
        let score = document.querySelector(".score");
        if(parseInt(score.textContent) < 15){
            score.style.color = "red";
        }

        console.log("wired", typeof(parseInt(score.textContent)));
    </script>

    <style>
        .result-container {
            height: 100dvh;
            display: grid;
            place-items: center;
        }
        .result-item {
            /* min-width: 100dvh; */
            width: 100%;
        }
    </style>

</body>
</html>
