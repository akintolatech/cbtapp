{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Examination Access Cards</title>
    <link type="x-icon" href="{% static 'img/AFIT.png' %}" rel="icon" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @page {
            size: A4 landscape;
            margin: 7mm;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
            color: #172033;
        }

       
        .print-container {
    width: 100%;
    max-width: 283mm;
    margin: 20px auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 45mm);

    gap: 3mm;
    align-content: start;
}

.card {
    width: 100%;
    height: 45mm;
    min-height: 45mm;

    background: #ffffff;
    border: 1px dashed #777;
    border-radius: 3mm;
    padding: 4mm;

    position: relative;
    overflow: hidden;

    display: flex;
    flex-direction: column;

    break-inside: avoid;
}

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dce3ed;
            padding-bottom: 2mm;
            margin-bottom: 2.5mm;
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #003151;
        }

        .card-label {
            font-size: 8px;
            font-weight: bold;
            background: #003151;
            color: white;
            padding: 1.5mm 2mm;
            border-radius: 2px;
        }

        .exam-url {
            font-size: 9px;
            color: #0074a8;
            font-weight: bold;
            margin-bottom: 3mm;
            word-break: break-all;
        }

        .info-label {
            font-size: 8px;
            color: #64748b;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1mm;
        }

        .student-name {
            font-size: 8px;
            font-weight: 700;
            color: #172033;
            border-bottom: 1px solid #dce3ed;
            padding-bottom: 1.5mm;
            margin-bottom: 2mm;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .access-section {
            margin-top: auto;
            background: #f0f6fa;
            border: 1px solid #d7e6f0;
            border-radius: 2mm;
            padding: 2mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .access-label {
            font-size: 8px;
            color: #475569;
            font-weight: bold;
        }

        .access-code {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #003151;
        }

        .card-footer {
            font-size: 7px;
            color: #94a3b8;
            text-align: center;
            margin-top: 1.5mm;
        }

        .print-button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            border: none;
            background: #003151;
            color: white;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }



@media print {

    @page {
        size: A4 landscape;
        margin: 7mm;
    }

    body {
        background: white;
    }

    .print-button {
        display: none !important;
    }

    .print-container {
        width: 100%;
        max-width: none;
        margin: 0;

        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 45mm);

        gap: 3mm;
        align-content: start;
    }

    .card {
        height: 45mm;
        min-height: 45mm;

        break-inside: avoid;
        page-break-inside: avoid;

        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}


    </style>
</head>

<body>

    <button class="print-button" onclick="window.print()">
        PRINT ACCESS CARDS
    </button>

    <div class="print-container">

        {% for student in students %}

        <div class="card">

            <div class="card-header">
                <div class="card-title">CBT EXAM</div>
                <div class="card-label">ADMIN - 08162065896 </div>
            </div>

            <div class="exam-url">
                {{ exam_url }}
            </div>

            <div class="info-label">Student Name</div>

            <div class="student-name">
                {{ student.username }}
            </div>

            <div class="access-section">
                <div class="access-label">ACCESS CODE</div>

                <div class="access-code">
                    {{ student.profile.access_code}}
                </div>
            </div>

            <div class="card-footer">
                {{ student.profile.class_arm}} 
            </div>

        </div>

        {% endfor %}

    </div>

</body>
</html>
