
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="x-icon" href="{% static 'img/logo.png' %}" rel="icon" />
    <title>Student Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            /* background: #f4f7fb; */
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            /* background: #ffffff; */
            padding: 40px 30px;
            /* border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08); */
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .login-card p {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            text-transform: uppercase;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .messages {
            margin-bottom: 20px;
        }

        .messages li {
            list-style: none;
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">

           <div class="logo-box"  style="display: grid; place-items: center;">
                <img src="{% static 'img/logo.png' %}" width="220px"/>
            </div>

        <h2>AFPS JOS CBT</h2>

        <!-- <p>Enter your student access code to continue.</p> -->

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">

                <label for="access_code">
                    Access Code
                </label>

                <input
                    type="text"
                    name="access_code"
                    id="access_code"
                    placeholder="Enter your access code"
                    required
                    autocomplete="off"
                    maxlength="12"
                >

            </div>

            <button type="submit">
                Access My Dashboard
            </button>

        </form>

        <div class="footer" style="color: red;">
            EXAMINATION MALPRACTICE EVEN ON THE INTERNET IS WRONG!
        </div>

    </div>

</body>
</html>
